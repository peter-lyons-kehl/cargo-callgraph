[package]
name = "cargo-callgraph"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Sienna Meridian Satterwhite <sienna@sunbeam.pt>"]
description = "Generate callgraphs for Rust workspaces using rust-analyzer"
keywords = ["cargo-subcommand", "callgraph", "rust-analyzer", "static-analysis"]
categories = ["development-tools::cargo-plugins", "development-tools::debugging"]
repository = "https://github.com/sienna/callgraph-rs"
readme = "README.md"

[dependencies]
# rust-analyzer internals (published to crates.io as ra_ap_*)
# Version pinning note: these crates are tightly coupled and released in lockstep.
# We let Cargo resolve a compatible set, then pin.
ra_ap_load-cargo = "=0.0.358"
ra_ap_project_model = "=0.0.358"
ra_ap_ide = "=0.0.358"
ra_ap_ide_db = "=0.0.358"
ra_ap_hir = "=0.0.358"
ra_ap_base_db = "=0.0.358"
ra_ap_vfs = "=0.0.358"
ra_ap_syntax = "=0.0.358"
ra_ap_paths = "=0.0.358"

# cargo-callgraph does NOT use the following two directly. However, we **do** list them here, so as
# to avoid "UNICODE_VERSION" incompatibility between these two crates.
#
# NOT v1.0.27 to be used yet
unicode-ident = "=1.0.24"
unicode-properties = "=0.1.4"

# graph + serialization
petgraph = "0.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI + errors
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# utilities
indexmap = "2"

# MCP server
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1.0"

[[bin]]
name = "cargo-callgraph"
path = "src/main.rs"
